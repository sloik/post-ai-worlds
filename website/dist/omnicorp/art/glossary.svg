<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE SEMANTIC ATLAS</title><desc id="desc">Six connected concepts: capability, agency, evidence, resources, continuity and legitimacy. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE SEMANTIC ATLAS</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 15</text><g><path d="M180 110L450 90" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M450 90L720 115" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M180 110L180 300" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M450 90L450 310" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M720 115L720 300" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M180 300L450 310" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M450 310L720 300" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M450 90L720 300" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M720 115L450 310" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><circle cx="180" cy="110" r="42" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><text x="180" y="114" text-anchor="middle" fill="#5cddd2" font-size="12">CAPABILITY</text><circle cx="450" cy="90" r="42" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="450" y="94" text-anchor="middle" fill="#d9ff43" font-size="12">AGENCY</text><circle cx="720" cy="115" r="42" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><text x="720" y="119" text-anchor="middle" fill="#5cddd2" font-size="12">EVIDENCE</text><circle cx="180" cy="300" r="42" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><text x="180" y="304" text-anchor="middle" fill="#5cddd2" font-size="12">RESOURCES</text><circle cx="450" cy="310" r="42" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="450" y="314" text-anchor="middle" fill="#d9ff43" font-size="12">CONTINUITY</text><circle cx="720" cy="300" r="42" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><text x="720" y="304" text-anchor="middle" fill="#5cddd2" font-size="12">LEGITIMACY</text><text x="450" y="210" text-anchor="middle" fill="#d9ff43" font-size="15">SHARED MEANINGS</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>