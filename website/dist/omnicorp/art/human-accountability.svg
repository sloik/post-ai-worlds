<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE ANSWERABILITY CHAIN</title><desc id="desc">Decision, explanation, responsibility and consequences form a chain, with correction returning to the decision. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE ANSWERABILITY CHAIN</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 13</text><g><circle cx="120" cy="190" r="50" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="120" y="194" text-anchor="middle" fill="#d9ff43" font-size="12">DECISION</text><path d="M170 190L285 190" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><circle cx="335" cy="190" r="50" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="335" y="194" text-anchor="middle" fill="#d9ff43" font-size="12">EXPLANATION</text><path d="M385 190L500 190" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><circle cx="550" cy="190" r="50" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><text x="550" y="194" text-anchor="middle" fill="#5cddd2" font-size="12">ANSWERABILITY</text><path d="M600 190L715 190" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><circle cx="765" cy="190" r="50" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="765" y="194" text-anchor="middle" fill="#d9ff43" font-size="12">CONSEQUENCE</text><path d="M765 250V315H120V250" stroke="#5cddd2" fill="none" stroke-width="1.5" class="flow" stroke-dasharray="4 7"/><text x="450" y="345" text-anchor="middle" fill="#5cddd2" font-size="12">CORRECTION RETURNS TO THE DECISION</text><text x="550" y="85" text-anchor="middle" fill="#d9ff43" font-size="12">WHO CAN ANSWER FOR THE OUTCOME?</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>