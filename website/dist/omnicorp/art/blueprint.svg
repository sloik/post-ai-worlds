<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE ORGANISATIONAL STACK</title><desc id="desc">Five connected organisational layers, from resources to human direction. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE ORGANISATIONAL STACK</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 02</text><g><path d="M230 315 l300 0 95 -38 -300 0 Z" stroke="#d9ff43" fill="#15271c" stroke-width="1.5" /><path d="M275 315L275 267" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="425" y="303" text-anchor="middle" fill="#dce8d2" font-size="12">RESOURCES</text><path d="M253 265 l300 0 95 -38 -300 0 Z" stroke="#5cddd2" fill="#15271c" stroke-width="1.5" /><path d="M298 265L298 217" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="448" y="253" text-anchor="middle" fill="#dce8d2" font-size="12">PRODUCT ENGINES</text><path d="M276 215 l300 0 95 -38 -300 0 Z" stroke="#d9ff43" fill="#15271c" stroke-width="1.5" /><path d="M321 215L321 167" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="471" y="203" text-anchor="middle" fill="#dce8d2" font-size="12">ORGANISATIONAL MEMORY</text><path d="M299 165 l300 0 95 -38 -300 0 Z" stroke="#5cddd2" fill="#15271c" stroke-width="1.5" /><path d="M344 165L344 117" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="494" y="153" text-anchor="middle" fill="#dce8d2" font-size="12">COORDINATION</text><path d="M322 115 l300 0 95 -38 -300 0 Z" stroke="#d9ff43" fill="#15271c" stroke-width="1.5" /><path d="M367 115L367 67" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="517" y="103" text-anchor="middle" fill="#dce8d2" font-size="12">HUMAN DIRECTION</text><text x="755" y="180" text-anchor="middle" fill="#d9ff43" font-size="12">FIVE LAYERS</text><text x="755" y="202" text-anchor="middle" fill="#8fa584" font-size="12">ONE SYSTEM</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>