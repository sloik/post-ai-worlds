<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE LEARNING PRODUCTION LINE</title><desc id="desc">A bounded software change moves through tests and review to release; lessons return to the next change. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE LEARNING PRODUCTION LINE</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 06</text><g><rect x="50" y="150" width="130" height="65" fill="#102019" stroke="#d9ff43" stroke-width="1"/><text x="115.0" y="186.5" text-anchor="middle" fill="#d9ff43" font-size="12">PROBLEM</text><path d="M180 182L220 182" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><rect x="220" y="150" width="130" height="65" fill="#102019" stroke="#d9ff43" stroke-width="1"/><text x="285.0" y="186.5" text-anchor="middle" fill="#d9ff43" font-size="12">CHANGE</text><path d="M350 182L390 182" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><rect x="390" y="150" width="130" height="65" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="455.0" y="186.5" text-anchor="middle" fill="#5cddd2" font-size="12">TEST</text><path d="M520 182L560 182" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><rect x="560" y="150" width="130" height="65" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="625.0" y="186.5" text-anchor="middle" fill="#5cddd2" font-size="12">REVIEW</text><path d="M690 182L730 182" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><rect x="730" y="150" width="130" height="65" fill="#102019" stroke="#d9ff43" stroke-width="1"/><text x="795.0" y="186.5" text-anchor="middle" fill="#d9ff43" font-size="12">RELEASE</text><path d="M795 220V310H115V225" stroke="#5cddd2" fill="none" stroke-width="1.5" stroke-dasharray="5 9" class="flow"/><text x="450" y="338" text-anchor="middle" fill="#5cddd2" font-size="12">LESSONS RETURN TO THE NEXT CHANGE</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>