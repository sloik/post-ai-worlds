<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE ADVERSARIAL TERRAIN</title><desc id="desc">An operating core faces dependency, erosion, coordination and demand risks; trust and knowledge reinforce it. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE ADVERSARIAL TERRAIN</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 10</text><g><path d="M315 200L450 65 585 200 450 335Z" stroke="#8fa584" fill="#122018" stroke-width="1.5" /><path d="M345 200L450 95 555 200 450 305Z" stroke="#5cddd2" fill="#122018" stroke-width="1.5" /><path d="M380 200L450 130 520 200 450 270Z" stroke="#d9ff43" fill="#122018" stroke-width="1.5" /><text x="450" y="203" text-anchor="middle" fill="#d9ff43" font-size="18">CORE</text><path d="M140 95L326.0 147.5" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="140" y="95" text-anchor="middle" fill="#5cddd2" font-size="12">DEPENDENCY</text><path d="M760 100L574.0 150.0" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="760" y="100" text-anchor="middle" fill="#5cddd2" font-size="12">EROSION</text><path d="M155 335L332.0 267.5" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="155" y="335" text-anchor="middle" fill="#5cddd2" font-size="12">COORDINATION</text><path d="M770 335L578.0 267.5" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="770" y="335" text-anchor="middle" fill="#5cddd2" font-size="12">DEMAND</text><path d="M335 290L250 355" stroke="#d9ff43" stroke-width="1.5" fill="none"/><text x="450" y="390" text-anchor="middle" fill="#d9ff43" font-size="12">TRUST + RETAINED KNOWLEDGE</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>