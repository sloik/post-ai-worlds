<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE RESOURCE WATERSHED</title><desc id="desc">Useful outcomes replenish resources, allocated to capability, verification and continuity. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE RESOURCE WATERSHED</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 08</text><g><path d="M330 85V220Q450 270 570 220V85" stroke="#d9ff43" fill="#1c301b" stroke-width="1.5" /><path d="M330 150Q450 190 570 150" stroke="#5cddd2" fill="none" stroke-width="1.5" /><text x="450" y="116" text-anchor="middle" fill="#d9ff43" font-size="15">RESOURCES</text><path d="M450 240V280H180V315" stroke="#5cddd2" fill="none" stroke-width="1.5" stroke-dasharray="4 7" class="flow"/><rect x="90" y="315" width="180" height="45" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="180.0" y="341.5" text-anchor="middle" fill="#5cddd2" font-size="12">CAPABILITY</text><path d="M450 240V280H450V315" stroke="#5cddd2" fill="none" stroke-width="1.5" stroke-dasharray="4 7" class="flow"/><rect x="360" y="315" width="180" height="45" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="450.0" y="341.5" text-anchor="middle" fill="#5cddd2" font-size="12">VERIFICATION</text><path d="M450 240V280H720V315" stroke="#5cddd2" fill="none" stroke-width="1.5" stroke-dasharray="4 7" class="flow"/><rect x="630" y="315" width="180" height="45" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="720.0" y="341.5" text-anchor="middle" fill="#5cddd2" font-size="12">CONTINUITY</text><path d="M190 95H300" stroke="#d9ff43" fill="none" stroke-width="1.5" stroke-dasharray="4 7" class="flow"/><text x="175" y="74" text-anchor="middle" fill="#8fa584" font-size="12">USEFUL OUTCOMES</text><text x="450" y="395" text-anchor="middle" fill="#8fa584" font-size="12">REINVESTMENT IS A CHOICE, NOT A GUARANTEE</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>