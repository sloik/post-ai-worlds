<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE PURPOSE COMPASS</title><desc id="desc">Purpose coordinates understanding, action, learning and retained knowledge. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE PURPOSE COMPASS</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 01</text><g><path d="M450 220L450 85" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><circle cx="450" cy="85" r="48" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><text x="450" y="89" text-anchor="middle" fill="#5cddd2" font-size="12">UNDERSTAND</text><path d="M450 220L700 220" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><circle cx="700" cy="220" r="48" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><text x="700" y="224" text-anchor="middle" fill="#5cddd2" font-size="12">ACT</text><path d="M450 220L450 345" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><circle cx="450" cy="345" r="48" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><text x="450" y="349" text-anchor="middle" fill="#5cddd2" font-size="12">LEARN</text><path d="M450 220L200 220" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><circle cx="200" cy="220" r="48" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><text x="200" y="224" text-anchor="middle" fill="#5cddd2" font-size="12">RETAIN</text><circle cx="450" cy="220" r="87" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="450" y="213" text-anchor="middle" fill="#d9ff43" font-size="17">PURPOSE</text><text x="450" y="239" text-anchor="middle" fill="#8fa584" font-size="12">CONTINUAL DEVELOPMENT</text><path d="M450 115 L465 180 L450 165 L435 180 Z" stroke="#d9ff43" fill="#d9ff4330" stroke-width="1.5" /></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>