<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE RETAINED LINEAGE</title><desc id="desc">Accepted checkpoints rise through evaluation gates while rejected candidates branch into restoration. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE RETAINED LINEAGE</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 05</text><g><path d="M160 300H245V235H300" stroke="#d9ff43" fill="none" stroke-width="1.5" class="flow" stroke-dasharray="6 4"/><circle cx="135" cy="300" r="30" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="135" y="304" text-anchor="middle" fill="#d9ff43" font-size="12">V0</text><text x="135" y="348" text-anchor="middle" fill="#8fa584" font-size="12">RETAINED</text><path d="M240 310L240 200" stroke="#5cddd2" stroke-width="1.5" fill="none"/><text x="240" y="188" text-anchor="middle" fill="#5cddd2" font-size="12">EVALUATE</text><path d="M350 235H435V170H490" stroke="#d9ff43" fill="none" stroke-width="1.5" class="flow" stroke-dasharray="6 4"/><circle cx="325" cy="235" r="30" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="325" y="239" text-anchor="middle" fill="#d9ff43" font-size="12">V1</text><text x="325" y="283" text-anchor="middle" fill="#8fa584" font-size="12">RETAINED</text><path d="M430 245L430 135" stroke="#5cddd2" stroke-width="1.5" fill="none"/><text x="430" y="123" text-anchor="middle" fill="#5cddd2" font-size="12">EVALUATE</text><path d="M540 170H625V105H680" stroke="#d9ff43" fill="none" stroke-width="1.5" class="flow" stroke-dasharray="6 4"/><circle cx="515" cy="170" r="30" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="515" y="174" text-anchor="middle" fill="#d9ff43" font-size="12">V2</text><text x="515" y="218" text-anchor="middle" fill="#8fa584" font-size="12">RETAINED</text><path d="M620 180L620 70" stroke="#5cddd2" stroke-width="1.5" fill="none"/><text x="620" y="58" text-anchor="middle" fill="#5cddd2" font-size="12">EVALUATE</text><circle cx="705" cy="105" r="30" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="705" y="109" text-anchor="middle" fill="#d9ff43" font-size="12">V3</text><text x="705" y="153" text-anchor="middle" fill="#8fa584" font-size="12">RETAINED</text><path d="M435 190V335H360" stroke="#8fa584" fill="none" stroke-width="1.5" stroke-dasharray="4 7"/><text x="405" y="357" text-anchor="middle" fill="#8fa584" font-size="12">REJECT / RESTORE</text><text x="750" y="325" text-anchor="middle" fill="#d9ff43" font-size="12">IMPROVE THE NEXT STARTING POINT</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>