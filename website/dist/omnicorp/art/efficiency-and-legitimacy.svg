<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE OPERATING ENVELOPE</title><desc id="desc">A conceptual operating envelope separates efficiency from a legitimacy boundary; no measured performance is plotted. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE OPERATING ENVELOPE</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 12</text><g><path d="M160 70V325H780" stroke="#8fa584" fill="none" stroke-width="1.5" /><path d="M160 260L780 100" stroke="#d9ff43" fill="none" stroke-width="1.5" /><path d="M280 325V70" stroke="#5cddd2" fill="none" stroke-width="1.5" stroke-dasharray="4 7"/><path d="M280 260L680 140 770 150V325H280Z" stroke="#5cddd2" fill="#17362a55" stroke-width="1.5" /><circle cx="580" cy="205" r="12" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="550" y="250" text-anchor="middle" fill="#d9ff43" font-size="12">OPERATING ENVELOPE</text><text x="515" y="363" text-anchor="middle" fill="#8fa584" font-size="12">VERIFIED VALUE / RESOURCE USE →</text><text x="185" y="55" text-anchor="middle" fill="#5cddd2" font-size="12">LEGITIMACY IS A SEPARATE CONDITION</text><text x="226" y="220" text-anchor="middle" fill="#5cddd2" font-size="12">FLOOR</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>