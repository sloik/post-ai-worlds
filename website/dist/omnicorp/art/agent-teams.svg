<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE RESPONSIBILITY CIRCUIT</title><desc id="desc">Explorer, designer, builder, critic and integrator exchange bounded work; critique can return a candidate. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE RESPONSIBILITY CIRCUIT</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 04</text><g><path d="M130 200H230.0V120H330" stroke="#5cddd2" fill="none" stroke-width="1.5" stroke-dasharray="5 8" class="flow"/><path d="M330 120H415.0V210H500" stroke="#5cddd2" fill="none" stroke-width="1.5" stroke-dasharray="5 8" class="flow"/><path d="M500 210H595.0V125H690" stroke="#5cddd2" fill="none" stroke-width="1.5" stroke-dasharray="5 8" class="flow"/><path d="M690 125H735.0V295H780" stroke="#5cddd2" fill="none" stroke-width="1.5" stroke-dasharray="5 8" class="flow"/><circle cx="130" cy="200" r="43" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="130" y="204" text-anchor="middle" fill="#d9ff43" font-size="12">EXPLORE</text><circle cx="330" cy="120" r="43" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="330" y="124" text-anchor="middle" fill="#d9ff43" font-size="12">DESIGN</text><circle cx="500" cy="210" r="43" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="500" y="214" text-anchor="middle" fill="#d9ff43" font-size="12">BUILD</text><circle cx="690" cy="125" r="43" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><text x="690" y="129" text-anchor="middle" fill="#5cddd2" font-size="12">CRITIQUE</text><circle cx="780" cy="295" r="43" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="780" y="299" text-anchor="middle" fill="#d9ff43" font-size="12">INTEGRATE</text><path d="M690 170V260H500" stroke="#d9ff43" fill="none" stroke-width="1.5" stroke-dasharray="4 7"/><text x="595" y="282" text-anchor="middle" fill="#8fa584" font-size="12">RETURN / REVISE</text><text x="135" y="310" text-anchor="middle" fill="#8fa584" font-size="12">BOUNDED MANDATES</text><text x="135" y="332" text-anchor="middle" fill="#5cddd2" font-size="12">EXPLICIT HANDOFFS</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>