<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE BOTTLENECK LENS</title><desc id="desc">An asset-light blueprint meets physical throughput constraints through a narrow bottleneck. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE BOTTLENECK LENS</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 14</text><g><rect x="70" y="110" width="230" height="75" fill="#102019" stroke="#d9ff43" stroke-width="1"/><text x="185.0" y="151.5" text-anchor="middle" fill="#d9ff43" font-size="12">ASSET-LIGHT BLUEPRINT</text><rect x="600" y="110" width="230" height="75" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="715.0" y="151.5" text-anchor="middle" fill="#5cddd2" font-size="12">PHYSICAL THROUGHPUT</text><path d="M300 147H380L425 230V300H475V230L520 147H600" stroke="#d9ff43" fill="#1a2a19" stroke-width="1.5" /><text x="450" y="335" text-anchor="middle" fill="#d9ff43" font-size="13">THE BINDING CONSTRAINT</text><path d="M655 225L655 280" stroke="#5cddd2" stroke-width="1.5" fill="none"/><text x="680" y="235" text-anchor="middle" fill="#8fa584" font-size="12">ENERGY</text><path d="M720 225L720 280" stroke="#5cddd2" stroke-width="1.5" fill="none"/><text x="680" y="262" text-anchor="middle" fill="#8fa584" font-size="12">FABRICATION</text><path d="M785 225L785 280" stroke="#5cddd2" stroke-width="1.5" fill="none"/><text x="680" y="289" text-anchor="middle" fill="#8fa584" font-size="12">SUPPLY CHAIN</text><text x="180" y="260" text-anchor="middle" fill="#8fa584" font-size="12">CLAIM</text><text x="180" y="290" text-anchor="middle" fill="#5cddd2" font-size="12">↔ COUNTER-READING</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>