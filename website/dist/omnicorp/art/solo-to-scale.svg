<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE SCALE LADDER</title><desc id="desc">Five stages of organisational scale; review capacity grows alongside creation. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE SCALE LADDER</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 03</text><g><circle cx="100" cy="160.0" r="10" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><path d="M124 160L245 160" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="100" y="285" text-anchor="middle" fill="#8fa584" font-size="12">ONE OPERATOR</text><text x="100" y="320" text-anchor="middle" fill="#d9ff43" font-size="12">GATE 01</text><circle cx="270" cy="144.5" r="10" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><circle cx="270" cy="175.5" r="10" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><path d="M294 160L425 160" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="270" y="285" text-anchor="middle" fill="#8fa584" font-size="12">REPEATABLE LOOP</text><text x="270" y="320" text-anchor="middle" fill="#d9ff43" font-size="12">GATE 02</text><circle cx="450" cy="129.0" r="10" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><circle cx="450" cy="160.0" r="10" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><circle cx="450" cy="191.0" r="10" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><path d="M474 160L615 160" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="450" y="285" text-anchor="middle" fill="#8fa584" font-size="12">SMALL TEAM</text><text x="450" y="320" text-anchor="middle" fill="#d9ff43" font-size="12">GATE 03</text><circle cx="640" cy="113.5" r="10" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><circle cx="640" cy="144.5" r="10" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><circle cx="640" cy="175.5" r="10" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><circle cx="640" cy="206.5" r="10" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><path d="M664 160L780 160" stroke="#8fa584" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><text x="640" y="285" text-anchor="middle" fill="#8fa584" font-size="12">SEVERAL ENGINES</text><text x="640" y="320" text-anchor="middle" fill="#d9ff43" font-size="12">GATE 04</text><circle cx="805" cy="98.0" r="10" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><circle cx="805" cy="129.0" r="10" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><circle cx="805" cy="160.0" r="10" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><circle cx="805" cy="191.0" r="10" fill="#122016" stroke="#5cddd2" stroke-width="1.2" class=""/><circle cx="805" cy="222.0" r="10" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="805" y="285" text-anchor="middle" fill="#8fa584" font-size="12">OPTIONAL SCALE</text><text x="805" y="320" text-anchor="middle" fill="#d9ff43" font-size="12">GATE 05</text><path d="M100 235 H805" stroke="#5cddd2" fill="none" stroke-width="1.5" /><text x="450" y="365" text-anchor="middle" fill="#5cddd2" font-size="12">REVIEW CAPACITY MUST GROW WITH CREATION</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>