<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE COMPOUNDING PRESS</title><desc id="desc">Plan, work, review and compound leave accumulated retained layers; this is an interpretation of a published method. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE COMPOUNDING PRESS</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 11</text><g><path d="M100 260l110 0 30 -15 -110 0 Z" stroke="#5cddd2" fill="#11241b" stroke-width="1.5" opacity=".5"/><rect x="100" y="125" width="140" height="90" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="170.0" y="174.0" text-anchor="middle" fill="#5cddd2" font-size="12">PLAN</text><text x="170" y="330" text-anchor="middle" fill="#8fa584" font-size="12">INTENT</text><path d="M245 170L290 170" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M295 260l110 0 30 -15 -110 0 Z" stroke="#5cddd2" fill="#11241b" stroke-width="1.5" opacity=".5"/><path d="M295 270l110 0 30 -15 -110 0 Z" stroke="#5cddd2" fill="#11241b" stroke-width="1.5" opacity=".5"/><rect x="295" y="125" width="140" height="90" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="365.0" y="174.0" text-anchor="middle" fill="#5cddd2" font-size="12">WORK</text><text x="365" y="330" text-anchor="middle" fill="#8fa584" font-size="12">CHANGE</text><path d="M440 170L485 170" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M490 260l110 0 30 -15 -110 0 Z" stroke="#5cddd2" fill="#11241b" stroke-width="1.5" opacity=".5"/><path d="M490 270l110 0 30 -15 -110 0 Z" stroke="#5cddd2" fill="#11241b" stroke-width="1.5" opacity=".5"/><path d="M490 280l110 0 30 -15 -110 0 Z" stroke="#5cddd2" fill="#11241b" stroke-width="1.5" opacity=".5"/><rect x="490" y="125" width="140" height="90" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="560.0" y="174.0" text-anchor="middle" fill="#5cddd2" font-size="12">REVIEW</text><text x="560" y="330" text-anchor="middle" fill="#8fa584" font-size="12">CRITIQUE</text><path d="M635 170L680 170" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M685 260l110 0 30 -15 -110 0 Z" stroke="#5cddd2" fill="#11241b" stroke-width="1.5" opacity=".5"/><path d="M685 270l110 0 30 -15 -110 0 Z" stroke="#5cddd2" fill="#11241b" stroke-width="1.5" opacity=".5"/><path d="M685 280l110 0 30 -15 -110 0 Z" stroke="#5cddd2" fill="#11241b" stroke-width="1.5" opacity=".5"/><path d="M685 290l110 0 30 -15 -110 0 Z" stroke="#5cddd2" fill="#11241b" stroke-width="1.5" opacity=".5"/><rect x="685" y="125" width="140" height="90" fill="#102019" stroke="#d9ff43" stroke-width="1"/><text x="755.0" y="174.0" text-anchor="middle" fill="#d9ff43" font-size="12">COMPOUND</text><text x="755" y="330" text-anchor="middle" fill="#8fa584" font-size="12">RETAIN</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>