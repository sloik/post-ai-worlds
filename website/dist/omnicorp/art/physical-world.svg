<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE REAL-WORLD BOUNDARY</title><desc id="desc">Reasoning crosses an authority boundary through interlocks, machines and sensor feedback. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE REAL-WORLD BOUNDARY</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 07</text><g><rect x="90" y="75" width="250" height="65" fill="#102019" stroke="#d9ff43" stroke-width="1"/><text x="215.0" y="111.5" text-anchor="middle" fill="#d9ff43" font-size="12">REASONING / PROPOSALS</text><rect x="560" y="75" width="250" height="65" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="685.0" y="111.5" text-anchor="middle" fill="#5cddd2" font-size="12">OBSERVATIONS / MODELS</text><path d="M215 140L215 210" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M685 210L685 140" stroke="#5cddd2" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M55 190H845" stroke="#8fa584" fill="none" stroke-width="1.5" stroke-dasharray="3 6"/><text x="450" y="179" text-anchor="middle" fill="#8fa584" font-size="12">CONTROL &amp; AUTHORITY BOUNDARY</text><rect x="95" y="245" width="240" height="65" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="215.0" y="281.5" text-anchor="middle" fill="#5cddd2" font-size="12">INTERLOCKS / PERMISSIONS</text><rect x="565" y="245" width="240" height="65" fill="#102019" stroke="#5cddd2" stroke-width="1"/><text x="685.0" y="281.5" text-anchor="middle" fill="#5cddd2" font-size="12">SENSORS / MEASUREMENT</text><path d="M335 277L565 277" stroke="#d9ff43" stroke-width="1.5" fill="none" stroke-dasharray="4 7" class="flow"/><path d="M375 330l75 -35 75 35 -75 35 Z" stroke="#d9ff43" fill="#20351c" stroke-width="1.5" /><path d="M450 278L450 330" stroke="#d9ff43" stroke-width="1.5" fill="none"/><text x="450" y="387" text-anchor="middle" fill="#dce8d2" font-size="12">REAL MACHINES. REAL CONSEQUENCES.</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>