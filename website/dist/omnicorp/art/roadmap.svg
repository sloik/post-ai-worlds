<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc"><title id="title">THE GATED EXPEDITION</title><desc id="desc">A roadmap passes evidence gates before opening several uncertain future paths. Conceptual diagram.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#31452f" stroke-width=".4" opacity=".5"/></pattern><radialGradient id="aura"><stop stop-color="#294b2255"/><stop offset="1" stop-color="#0a1012"/></radialGradient></defs><style>text{font-family:ui-monospace,Consolas,monospace;letter-spacing:1px}.flow{animation:signal 12s linear infinite}@keyframes signal{to{stroke-dashoffset:-80}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="450" fill="#0a1012"/><rect width="900" height="450" fill="url(#aura)"/><rect x="30" y="55" width="840" height="350" fill="url(#grid)"/><text x="35" y="28" text-anchor="start" fill="#d9ff43" font-size="12">THE GATED EXPEDITION</text><text x="865" y="28" text-anchor="end" fill="#8fa584" font-size="12">OMNI / PLATE 09</text><g><path d="M80 320L230 235 380 270 520 175 670 200" stroke="#d9ff43" fill="none" stroke-width="1.5" stroke-dasharray="7 4" class="flow"/><circle cx="80" cy="320" r="18" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="80" y="324" text-anchor="middle" fill="#d9ff43" font-size="12">1</text><text x="80" y="363" text-anchor="middle" fill="#8fa584" font-size="12">USEFUL WORK</text><circle cx="230" cy="235" r="18" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="230" y="239" text-anchor="middle" fill="#d9ff43" font-size="12">2</text><text x="230" y="278" text-anchor="middle" fill="#8fa584" font-size="12">REPEATABILITY</text><circle cx="380" cy="270" r="18" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="380" y="274" text-anchor="middle" fill="#d9ff43" font-size="12">3</text><text x="380" y="313" text-anchor="middle" fill="#8fa584" font-size="12">RELIABILITY</text><circle cx="520" cy="175" r="18" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="520" y="179" text-anchor="middle" fill="#d9ff43" font-size="12">4</text><text x="520" y="218" text-anchor="middle" fill="#8fa584" font-size="12">DELEGATION</text><circle cx="670" cy="200" r="18" fill="#122016" stroke="#d9ff43" stroke-width="1.2" class=""/><text x="670" y="204" text-anchor="middle" fill="#d9ff43" font-size="12">5</text><text x="670" y="243" text-anchor="middle" fill="#8fa584" font-size="12">NEW ENGINES</text><path d="M670 200L820 80M670 200L840 210M670 200L790 345" stroke="#5cddd2" fill="none" stroke-width="1.5" opacity=".4" stroke-dasharray="3 7"/><text x="770" y="390" text-anchor="middle" fill="#5cddd2" font-size="12">OPTIONS, NOT PROMISES</text></g><text x="35" y="432" text-anchor="start" fill="#8fa584" font-size="12">CONCEPTUAL DIAGRAM / NOT LIVE TELEMETRY</text><text x="865" y="432" text-anchor="end" fill="#5cddd2" font-size="12">OMNICORP FIELD NOTES</text></svg>