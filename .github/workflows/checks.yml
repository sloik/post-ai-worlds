name: Public research checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Check retained public source and evidence
        run: |
          python3 tools/check.py
          python3 -m unittest discover -s tests -v
      - name: Obtain pinned public TLC artifact
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output /tmp/post-ai-tla2tools.jar
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/post-ai-tla2tools.jar' | sha256sum --check
      - name: Execute fresh finite models and controls
        run: |
          java -version
          python3 tools/run_models.py --jar /tmp/post-ai-tla2tools.jar
          python3 tools/check.py
