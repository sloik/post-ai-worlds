name: Oracle TLA verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oracle-tla-main
  cancel-in-progress: true
jobs:
  tla:
    if: github.repository == 'sloik/post-ai-worlds' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, ARM64, oracle, post-ai-worlds]
    timeout-minutes: 15
    steps:
      - name: Checkout maintained main revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Validate retained source and regression controls
        run: |
          python3 tools/check.py
          python3 -m unittest discover -s tests -v
      - name: Verify pinned TLC artifact
        run: |
          echo '936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /opt/tla/tla2tools-1.7.4.jar' | sha256sum --check
      - name: Run fresh finite models and semantic controls
        run: |
          python3 tools/run_models.py --java /usr/bin/java --jar /opt/tla/tla2tools-1.7.4.jar
          python3 tools/check.py
