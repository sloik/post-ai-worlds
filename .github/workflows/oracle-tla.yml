name: Oracle TLA verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  checks: write
jobs:
  tla:
    if: github.repository == 'sloik/post-ai-worlds'
    runs-on: [self-hosted, Linux, ARM64, oracle, post-ai-worlds]
    timeout-minutes: 120
    steps:
      - name: Checkout maintained main workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Queue explicit manual main verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -B ci/queue_pr_models.py --manual
